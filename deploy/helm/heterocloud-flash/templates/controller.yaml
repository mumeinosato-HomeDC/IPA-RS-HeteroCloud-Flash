apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flash.fullname" . }}-controller
  labels:
    {{- include "flash.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "flash.name" . }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "flash.name" . }}
        app.kubernetes.io/component: controller
        app.kubernetes.io/part-of: heterocloud
    spec:
      serviceAccountName: {{ include "flash.serviceAccountName" . }}
      securityContext:
        {{- include "flash.podSecurityContext" . | nindent 8 }}
      affinity:
        {{- include "flash.affinity" (dict "root" . "component" "controller") | nindent 8 }}
      containers:
        - name: controller
          image: {{ include "flash.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/flash-controller"]
          env:
            - name: FLASH_WORKLOAD_IDENTITY_ENDPOINT
              value: {{ .Values.workloadIdentity.endpoint | quote }}
            - name: FLASH_PUBLIC_DOMAIN
              value: {{ .Values.publicDomain | quote }}
            - name: FLASH_WORKLOAD_NAMESPACE
              value: {{ .Values.workloadNamespace | quote }}
            - name: FLASH_HELPER_IMAGE
              value: {{ default (include "flash.image" .) .Values.workloadHelperImage | quote }}
            - name: FLASH_ACTIVATOR_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: FLASH_ACTIVATOR_SERVICE
              value: {{ printf "%s-activator" (include "flash.fullname" .) | quote }}
            - name: FLASH_ACTIVATOR_PORT
              value: {{ .Values.activator.port | quote }}
            - name: FLASH_ADDITIONAL_PROTECTED_CIDRS_JSON
              value: {{ .Values.networkPolicy.additionalProtectedCidrs | toJson | quote }}
            - name: FLASH_DNS_CIDRS_JSON
              value: {{ required "networkPolicy.dnsCidrs must contain the cluster DNS service addresses" .Values.networkPolicy.dnsCidrs | toJson | quote }}
            - name: FLASH_VPC_GUARD_CIDRS_JSON
              value: {{ .Values.networkPolicy.vpcGuardCidrs | toJson | quote }}
            - name: FLASH_SECRET_MANAGER_CIDRS_JSON
              value: {{ .Values.networkPolicy.secretManagerCidrs | toJson | quote }}
            {{- if .Values.persistence.enabled }}
            - name: FLASH_PERSISTENT_STORAGE_CLASS
              value: {{ required "persistence.storageClass is required" .Values.persistence.storageClass | quote }}
            {{- end }}
            {{- if .Values.adminVolumeMounts }}
            - name: FLASH_ADMIN_VOLUME_MOUNTS_JSON
              value: {{ .Values.adminVolumeMounts | toJson | quote }}
            {{- end }}
            {{- if .Values.registry.enabled }}
            - name: FLASH_REGISTRY_HOST
              value: {{ required "registry.host is required" .Values.registry.host | quote }}
            - name: FLASH_REGISTRY_USERNAME
              value: {{ required "registry.username is required" .Values.registry.username | quote }}
            - name: FLASH_REGISTRY_PASSWORD_FILE
              value: /var/run/secrets/registry/password
            - name: FLASH_REGISTRY_PULL_SECRET
              value: {{ required "registry.workloadPullSecretName is required" .Values.registry.workloadPullSecretName | quote }}
            {{- if .Values.registry.caConfigMapName }}
            - name: FLASH_REGISTRY_CA_FILE
              value: /var/run/secrets/registry-ca/ca.crt
            {{- end }}
            {{- end }}
          {{- if .Values.registry.enabled }}
          volumeMounts:
            - name: registry-auth
              mountPath: /var/run/secrets/registry
              readOnly: true
            {{- if .Values.registry.caConfigMapName }}
            - name: registry-ca
              mountPath: /var/run/secrets/registry-ca
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            {{- include "flash.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
      {{- if .Values.registry.enabled }}
      volumes:
        - name: registry-auth
          secret:
            secretName: {{ required "registry.authSecretName is required" .Values.registry.authSecretName }}
            defaultMode: 0440
            items:
              - key: {{ required "registry.passwordKey is required" .Values.registry.passwordKey }}
                path: password
        {{- if .Values.registry.caConfigMapName }}
        - name: registry-ca
          configMap:
            name: {{ .Values.registry.caConfigMapName | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
