image:
  repository: ghcr.io/ipa-cyberlab/ipa-rs-heterocloud-flash
  tag: "0.1.47"
  pullPolicy: IfNotPresent

# Pin separately when a provider-only update must retain existing helper images.
# Empty follows image.repository/image.tag.
workloadHelperImage: ""

api:
  replicaCount: 3
  port: 8080
  maxExecSessions: 32
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

activator:
  replicaCount: 2
  port: 8081
  coldStartTimeoutSeconds: 120
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Trusted provider suffix; empty disables load_balancer and web endpoints.
# Web uses the existing heterocloud-edge/heterocloud-edge Gateway, listener http.
# Gateway API v1 CRDs and external wildcard DNS/TLS must be installed by the platform.
publicDomain: ""

controller:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

persistence:
  enabled: false
  storageClass: ""

# Platform-administered PVCs can be mounted into selected services without
# exposing Kubernetes volume selection to tenant API callers.
adminVolumeClaims: []
# - name: escape-syouyu-workspace
#   storageClass: syouyu-flash-escape
#   size: 10Gi
adminVolumeMounts: {}
# "00000000-0000-0000-0000-000000000001":
#   - name: syouyu-workspace
#     claimName: escape-syouyu-workspace
#     mountPath: /root/syouyu
#     readOnly: false

registry:
  enabled: false
  host: registry.heterocloud.example.com
  username: admin
  authSecretName: heterocloud-registry-pull-auth
  passwordKey: password
  workloadPullSecretName: heterocloud-registry-pull
  # Optional ConfigMap (key ca.crt) with the CA of a private registry; used for image
  # inspection. Nodes must trust it separately for pulls.
  caConfigMapName: ""

providerAuth:
  issuer: heterocloud
  audience: heterocloud-flash
  existingSecret: ""
  publicKeysSecretKey: provider-public-keys.json
  # Public verification keys are not credentials. Production may either set
  # this JSON map or reference a separately reconciled Secret above.
  publicKeysJson: ""

workloadNamespace: heterocloud-flash-workloads
runtimeClass:
  create: true
  name: gvisor
  handler: runsc
  nodeSelector:
    flash.heterocloud.io/gvisor-ready: "true"

networkPolicy:
  vpcGuardCidrs: []
  # These networks are removed from tenant egress even when Internet access
  # is enabled. RFC1918, CGNAT, loopback and link-local ranges are protected
  # by the provider itself; add deployment-specific public infrastructure here.
  additionalProtectedCidrs: []
  secretManagerCidrs: []
  dnsCidrs:
    - 10.96.0.10/32

serviceAccount:
  create: true
  name: ""

nodeSelector: {}
tolerations: []

# Public HTTPS HeteroCloud origin used by Pod-bound, rotating workload identity.
workloadIdentity:
  endpoint: ""
